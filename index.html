<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marco Fissore '27</title>
  <meta name="description" content="Marco Fissore's personal site — projects, robotics, rocketry, art, and guides.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="src/favicon/Icon-Lowres.png">
</head>

<body>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="#/home"> <img src="src/favicon/Icon-Lowres.png"> Marco Fissore <span class="brand-year">'27</span></a>

      <div class="header-actions">
        <button class="icon-btn" id="themeToggle" type="button" aria-label="Switch to light mode">
          <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18">
            <circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6" />
            <g stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
              <line x1="12" y1="1.5" x2="12" y2="4.5" />
              <line x1="12" y1="19.5" x2="12" y2="22.5" />
              <line x1="1.5" y1="12" x2="4.5" y2="12" />
              <line x1="19.5" y1="12" x2="22.5" y2="12" />
              <line x1="4.4" y1="4.4" x2="6.5" y2="6.5" />
              <line x1="17.5" y1="17.5" x2="19.6" y2="19.6" />
              <line x1="4.4" y1="19.6" x2="6.5" y2="17.5" />
              <line x1="17.5" y1="6.5" x2="19.6" y2="4.4" />
            </g>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18">
            <path fill="currentColor" d="M20.6 15.3A8.5 8.5 0 1 1 8.7 3.4a7 7 0 1 0 11.9 11.9Z" />
          </svg>
        </button>
        <button class="menu-toggle" id="menuToggle" type="button" aria-label="Open site menu" aria-expanded="false">
          <span>Menu</span>
          <svg viewBox="0 0 24 24" width="14" height="14">
            <path d="M5 8l7 8 7-8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round" />
          </svg>
        </button>
      </div>
    </div>

    <div class="mega-menu" id="megaMenu">
      <div class="mega-menu-inner" id="megaMenuInner"></div>
    </div>
  </header>

  <button class="outline-toggle" id="outlineToggle" type="button" aria-label="Open page outline" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>

  <div class="outline-panel" id="outlinePanel">
    <div class="outline-panel-header">
      <span>On this page</span>
      <button class="outline-close" id="outlineClose" type="button" aria-label="Close outline">&times;</button>
    </div>
    <div class="outline-body" id="outlineBody"></div>
  </div>

  <div class="layout">
    <main class="content" id="content">
      <div class="loading">Loading…</div>
    </main>
  </div>

  <footer class="site-footer">
    <p>&copy; <span id="year"></span> Marco Fissore. Built as a static markdown-driven site.</p>
  </footer>

  <script src="js/media.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/outline.js"></script>
  <script src="js/landing.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/background.js"></script>
  <script src="js/router.js"></script>
  <script src="js/projects.js"></script>
  <script src="js/main.js"></script>
</body>

</html>
